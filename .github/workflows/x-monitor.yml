name: X Monitor

on:
  schedule:
    # 每小时整点运行一次（UTC 时间，即北京时间整点 +8 小时）
    # 例：北京时间 08:00 → 这里写 00:00 UTC；北京时间 09:00 → 01:00 UTC
    - cron: "0 * * * *"
  workflow_dispatch: # 支持手动触发（仓库 Actions 页面点按钮）

permissions:
  contents: write # 允许把 pending.json / state.json 提交回仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (fetch tweets to pending queue)
        run: python monitor.py

      - name: Commit pending queue & state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending.json state.json
          git diff --cached --quiet || git commit -m "chore: update pending queue & state [skip ci]"
          git push

      - name: Fail on consecutive fetch failures (alert)
        # monitor.py 不再 exit 1（避免跳过 commit 步骤导致诊断无法落盘），
        # 改为在 state.json 写 _alert 标记；这里检测到告警则让本轮 Actions 变红
        run: |
          python - <<'EOF'
          import json, sys
          try:
              with open("state.json", encoding="utf-8") as f:
                  st = json.load(f)
              alert = st.get("_alert", {})
              if alert.get("active"):
                  print("❌ " + alert.get("message", "连续抓取失败告警"))
                  sys.exit(1)
              print("✅ 无告警，连续失败数:", alert.get("consecutive_fail", 0))
          except Exception as e:
              print("跳过告警检查:", e)
          EOF
